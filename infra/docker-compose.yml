services:
  neo4j:
    image: neo4j:5-community
    container_name: opint-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (open http://localhost:7474 to explore the graph)
      - "7687:7687"   # Bolt protocol (used by the Python neo4j driver)
    environment:
      NEO4J_AUTH: neo4j/opint123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: opint-postgres
    ports:
      - "5432:5432"   # Postgres (used by SQLAlchemy for audit log)
    environment:
      POSTGRES_USER: opint
      POSTGRES_PASSWORD: opint123
      POSTGRES_DB: opint
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opint -d opint"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
